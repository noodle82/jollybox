name: Publish to bluffle.co.uk/jollybox
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bluffle-jollybox-folder
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install and build website
        run: |
          node unpack.cjs
          npm install -g pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build:site
      - name: Check publishing credential
        env:
          DEPLOY_TOKEN: ${{ secrets.BLUFFLE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Add BLUFFLE_DEPLOY_TOKEN in this repository's Actions secrets. It needs Contents read/write for noodle82/Bluffle."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          repository: noodle82/Bluffle
          ref: main
          path: bluffle-site
          token: ${{ secrets.BLUFFLE_DEPLOY_TOKEN }}
      - name: Copy only the JollyBOX subfolder
        run: node -e "require('node:fs').cpSync('dist/jollybox','bluffle-site/jollybox',{recursive:true})"
      - name: Publish the folder to the existing Bluffle site
        working-directory: bluffle-site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- jollybox
          if git diff --cached --quiet; then
            echo 'JollyBOX is already up to date.'
            exit 0
          fi
          git commit -m 'Publish JollyBOX website in /jollybox'
          git push origin HEAD:main
