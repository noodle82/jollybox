name: Publish standalone JollyBOX Pages site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jollybox-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install and check
        run: |
          node unpack.cjs
          npm install -g pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm check
      - name: Build date-locked web app
        run: pnpm build
        env:
          JOLLYBOX_PREVIEW: 'false'
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: www
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
